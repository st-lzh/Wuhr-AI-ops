# version属性在新版本Docker Compose中已废弃，移除以避免警告

services:
  # PostgreSQL 数据库服务
  postgres:
    image: postgres:15-alpine
    container_name: wuhr-ai-ops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?}
      POSTGRES_USER: ${DB_USER:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wuhr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?} -d ${DB_NAME:?}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Redis 缓存服务（为未来功能准备）
  redis:
    image: redis:7-alpine
    container_name: wuhr-ai-ops-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - wuhr-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Wuhr AI Ops 主应用服务
  app:
    image: wuhr-ai-ops:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wuhr-ai-ops-app
    restart: unless-stopped
    env_file:
      # 仅在容器运行时注入远程后端地址和 API Key，不打进镜像。
      - .env.local
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:?}
      - DB_USER=${DB_USER:?}
      - DB_PASSWORD=${DB_PASSWORD:?}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?}@redis:6379
      - DATABASE_URL=postgresql://${DB_USER:?}:${DB_PASSWORD:?}@postgres:5432/${DB_NAME:?}?sslmode=disable&connection_limit=10&pool_timeout=20&connect_timeout=10
      - DIRECT_URL=postgresql://${DB_USER:?}:${DB_PASSWORD:?}@postgres:5432/${DB_NAME:?}?sslmode=disable&connection_limit=5&pool_timeout=20&connect_timeout=10
      - JWT_SECRET=${JWT_SECRET:?}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?}
      - NEXT_TELEMETRY_DISABLED=1
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./deployments:/app/deployments
      - app_logs:/app/logs
    networks:
      - wuhr-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # 独立常驻部署调度器：不依赖 Next.js 页面请求或热加载生命周期。
  deployment-scheduler:
    image: wuhr-ai-ops:local
    pull_policy: never
    container_name: wuhr-ai-ops-deployment-scheduler
    restart: unless-stopped
    command: ["node", "scripts/deployment-scheduler-worker.cjs"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:?}:${DB_PASSWORD:?}@postgres:5432/${DB_NAME:?}?sslmode=disable&connection_limit=3&pool_timeout=20&connect_timeout=10
      - DIRECT_URL=postgresql://${DB_USER:?}:${DB_PASSWORD:?}@postgres:5432/${DB_NAME:?}?sslmode=disable&connection_limit=2&pool_timeout=20&connect_timeout=10
      - JWT_SECRET=${JWT_SECRET:?}
      - SCHEDULER_APP_URL=http://app:3000
      - DEPLOYMENT_SCHEDULER_INTERVAL_MS=30000
    networks:
      - wuhr-network
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_logs:
    driver: local

networks:
  wuhr-network:
    driver: bridge
